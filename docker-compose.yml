services:
  db:
    image: postgres:16-alpine
    container_name: cabinet_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cabinet_medical}
      POSTGRES_USER: ${POSTGRES_USER:-cabinet_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabinet_secure_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cabinet_user} -d ${POSTGRES_DB:-cabinet_medical}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cabinet_backend
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-key-change-me}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-backend,localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      - DATABASE_URL=postgres://${POSTGRES_USER:-cabinet_user}:${POSTGRES_PASSWORD:-cabinet_secure_pass}@db:5432/${POSTGRES_DB:-cabinet_medical}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.example.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
    volumes:
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cabinet_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  media_volume:
